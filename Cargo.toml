[package]
name = "net-sentinel"
version = "0.1.0"
edition = "2024"
description = "A local HTTP blacklist interceptor with extensible actions and a GPUI interface"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-channel = "2.5"
chrono = { version = "0.4", features = ["clock"] }
directories = "6.0"
globset = "0.4"
gpui = "0.2.2"
regex = "1.11"
rfd = "0.15"
rodio = { version = "0.21", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tray-icon = "0.21"
unicode-segmentation = "1.12"
url = "2.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Networking_WinInet"] }

[dev-dependencies]
tempfile = "3.20"

[build-dependencies]
embed-resource = "3.0"
ico = "0.5"

[profile.release]
strip = true
lto = "thin"
